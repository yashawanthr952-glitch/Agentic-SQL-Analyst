services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      # Files in this directory run in name order on first boot only. schema.sql
      # creates the read-only analyst_ro role the backend connects as.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      # Connects as analyst_ro, NOT postgres. Guardrail layer 1: the role this
      # app authenticates as has no write grants at all.
      DATABASE_URL: postgresql+psycopg://analyst_ro:analyst_ro@postgres:5432/analytics
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      MODEL: ${MODEL:-claude-opus-5}
      MAX_ROWS: ${MAX_ROWS:-1000}
      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-5000}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
